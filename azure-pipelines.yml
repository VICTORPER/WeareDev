trigger:
  - main   # Ejecuta el pipeline cuando hay cambios en la rama main

pool:
  vmImage: 'ubuntu-latest'   # Usa un agente gratuito en Linux

steps:
  # Paso 1: Descargar código
  - checkout: self

  # Paso 2: Configurar Node.js
  - task: UseNode@1
    inputs:
      version: '18.x'   # Ajusta a la versión que uses

  # Paso 3: Instalar dependencias
  - script: |
      npm install
    displayName: 'Instalar dependencias'

  # Paso 4 (opcional): Compilar proyecto
  - script: |
      npm run build
    displayName: 'Compilar proyecto'

  # Paso 5: Publicar artefacto
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'dist'        # Carpeta generada al compilar (ajusta si es build/, out/, etc.)
      ArtifactName: 'drop'         # Nombre del artefacto
      publishLocation: 'Container'