trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
  # 1. Checkout del código
  - task: Checkout@1
    displayName: "Checkout del repositorio"

  # 2. Configuración de Java
  - task: UseJavaVersion@1
    inputs:
      versionSpec: '11'
      architecture: 'x64'
    displayName: "Usar Java 11"

  # 3. Ejecutar pruebas con Gradle (no falla el job si hay escenarios fallidos)
  - task: Gradle@2
    inputs:
      workingDirectory: ''
      gradleWrapperFile: 'gradlew'
      gradleOptions: '-Xmx3072m'
      tasks: 'clean test aggregate'
      publishJUnitResults: false
    continueOnError: true     # <--- evita que el pipeline se detenga
    displayName: "Ejecutar pruebas con Gradle"

  # 4. Publicar resultados de pruebas en Azure (escenarios fallidos incluidos)
  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'
      testRunTitle: 'Resultados de pruebas Cucumber/Serenity'
      mergeTestResults: true
    condition: succeededOrFailed()
    displayName: "Publicar resultados de pruebas"

  # 5. Publicar Serenity Report como artefacto descargable
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'target/site/serenity'
      ArtifactName: 'SerenityReport'
      publishLocation: 'Container'
    condition: succeededOrFailed()
    displayName: "Publicar reporte Serenity"